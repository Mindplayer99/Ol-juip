<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flappy Bird 🐤</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#79c9f5;font-family:system-ui,'Segoe UI',Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#box{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#score{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;text-align:center;pointer-events:none;z-index:5}
#score b{font-size:64px;font-weight:900;color:#fff;-webkit-text-stroke:2px #0b6aa5;text-shadow:0 4px 0 rgba(0,0,0,.25);line-height:1;display:inline-block}
#score.pop b{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.35)}}
#bestTag{position:fixed;top:calc(env(safe-area-inset-top,0px) + 86px);left:0;right:0;text-align:center;pointer-events:none;z-index:5}
#bestTag span{background:rgba(0,0,0,.5);color:#fde047;font-weight:800;font-size:13px;padding:5px 16px;border-radius:20px;letter-spacing:1px}
#soundBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:20;width:44px;height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.9);background:rgba(0,0,0,.4);color:#fff;font-size:20px;cursor:pointer}
.overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(10,30,60,.45)}
.hidden{display:none!important}
.logo{font-size:52px;font-weight:900;color:#fde047;line-height:.95;letter-spacing:1px;text-shadow:0 3px 0 #ea580c,0 6px 0 rgba(0,0,0,.3);transform:rotate(-3deg)}
.sub{color:#fff;font-weight:800;margin-top:10px;text-shadow:0 2px 6px #000;font-size:16px}
.birdDemo{font-size:64px;margin:6px 0;animation:bob 1s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.hint{background:#fff;color:#0f172a;font-weight:800;padding:12px 22px;border-radius:30px;margin-top:10px;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.3);animation:bob 1.2s infinite}
.btn{margin-top:20px;background:linear-gradient(#4ade80,#16a34a);border:0;border-bottom:6px solid #14532d;color:#fff;font-size:22px;font-weight:900;padding:15px 55px;border-radius:18px;cursor:pointer;letter-spacing:1px;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.btn:active{transform:translateY(4px);border-bottom-width:2px}
.btn.orange{background:linear-gradient(#fb923c,#ea580c);border-bottom-color:#7c2d12}
.card{background:#fefce8;border-radius:20px;padding:20px 30px;min-width:250px;box-shadow:0 8px 0 rgba(0,0,0,.3);margin-top:16px}
.card h2{color:#ea580c;font-size:15px;letter-spacing:3px}
.card .big{font-size:56px;font-weight:900;color:#0f172a;line-height:1}
.card .row{display:flex;justify-content:space-between;gap:30px;margin-top:10px;font-weight:800;color:#64748b;font-size:14px}
.card .row span:last-child{color:#0f172a;font-size:20px}
#newBest{background:#ef4444;color:#fff;font-weight:900;font-size:12px;padding:3px 12px;border-radius:10px;margin-top:8px;display:inline-block;animation:pop .5s infinite}
.tip{margin-top:14px;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 3px #000;opacity:.9}
</style>
</head>
<body>
<div id="box"><canvas id="c"></canvas></div>
<div id="score"><b id="scoreNum">0</b></div>
<div id="bestTag"><span id="bestNum">BEST: 0</span></div>
<button id="soundBtn" title="sound">🔊</button>

<div id="startScr" class="overlay">
  <div class="logo">FLAPPY<br>BIRD</div>
  <div class="sub">🐤 Mobile Game 🔥</div>
  <div class="birdDemo">🐤</div>
  <div class="hint">👆 SCREEN PAR TAP KARO = UDO</div>
  <button class="btn" id="startBtn">▶ START</button>
  <div class="tip">Pipe se bach ke aage niklo!</div>
</div>

<div id="overScr" class="overlay hidden">
  <div class="logo" style="font-size:40px">GAME OVER</div>
  <div class="card">
    <h2>SCORE</h2>
    <div class="big" id="fScore">0</div>
    <div id="newBest" class="hidden">★ NEW BEST! ★</div>
    <div class="row"><span>BEST</span><span id="fBest">0</span></div>
    <div class="row"><span>MEDAL</span><span id="fMedal">🥚</span></div>
  </div>
  <button class="btn orange" id="retryBtn">↻ FIR SE KHELO</button>
</div>

<script>
(()=>{ "use strict";
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const box=document.getElementById('box');
const scoreNum=document.getElementById('scoreNum'), scoreWrap=document.getElementById('score');
const bestNum=document.getElementById('bestNum');
const startScr=document.getElementById('startScr'), overScr=document.getElementById('overScr');
const fScore=document.getElementById('fScore'), fBest=document.getElementById('fBest'), fMedal=document.getElementById('fMedal'), newBest=document.getElementById('newBest');
const soundBtn=document.getElementById('soundBtn');

let W=0,H=0,DPR=1,GROUND=80;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  GROUND=Math.max(64,Math.min(110,H*0.1));
}
addEventListener('resize',resize); addEventListener('orientationchange',()=>setTimeout(resize,200)); resize();

let best=+(localStorage.getItem('flappy_best_v2')||localStorage.getItem('flappy_best')||0);
bestNum.textContent='BEST: '+best;

let soundOn=true;
soundBtn.onclick=e=>{e.stopPropagation();soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊':'🔇';};

// --- audio ---
let AC=null;
function tone(f,d,type,vol,when){
  if(!soundOn) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime+(when||0);
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(vol||.07,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
const sFlap=()=>tone(520,.09,'square',.05);
const sScore=()=>{tone(880,.09,'sine',.09);tone(1318,.14,'sine',.09,.09);};
const sHit=()=>tone(150,.35,'sawtooth',.12);
const sDie=()=>tone(300,.4,'square',.07,.15);

// --- game state ---
let state='ready', score=0, frames=0, lastT=0;
let bird, pipes, clouds, hills, parts, gX=0, shake=0, flash=0, startY=0, lastGapY=0;

function reset(){
  bird={x:W*0.32,y:H*0.42,v:0,r:Math.max(15,Math.min(20,W*0.045)),wing:0,rot:0,targetRot:0};
  pipes=[];parts=[];score=0;shake=0;flash=0;
  scoreNum.textContent='0';
  clouds=Array.from({length:6},()=>({x:Math.random()*W,y:20+Math.random()*H*0.4,w:50+Math.random()*90,s:.25+Math.random()*.6}));
  hills=[{x:0,w:W*0.7,h:70},{x:W*0.6,w:W*0.8,h:90},{x:W*1.3,w:W*0.7,h:60}];
  startY=bird.y;
  lastGapY=(playTop()+playBot())/2;
  // pre-place 2 evenly-spaced bars so ready screen looks aligned
  const sp0=pipeW()+Math.max(210,W*0.58);
  const gh0=Math.max(150,H*0.215);
  [W*0.9, W*0.9+sp0].forEach(px=>{
    pipes.push({x:px,top:lastGapY-gh0/2,bot:lastGapY+gh0/2,passed:false});
  });
}

const gapH=()=>Math.max(150,H*0.215);
const pipeW=()=>Math.max(64,Math.min(86,W*0.18));
const speed=()=>Math.max(170,H*0.0+ (W*0.45) + score*4); // px/sec
function playTop(){return 90;}
function playBot(){return H-GROUND-70;}
function pipeSpacing(){return pipeW()+Math.max(210,W*0.58);}

function addPipe(){
  const gh=gapH();
  const top=playTop(), bot=playBot();
  const minC=top+gh/2, maxC=bot-gh/2;
  // random but aligned: max step from previous gap stops extreme jumps
  const maxStep=Math.max(120,H*0.18);
  let lo=Math.max(minC,lastGapY-maxStep), hi=Math.min(maxC,lastGapY+maxStep);
  if(hi<lo){lo=minC;hi=maxC;}
  const c=lo+Math.random()*(hi-lo);
  lastGapY=c;
  pipes.push({x:W+10,top:c-gh/2,bot:c+gh/2,passed:false});
}
reset();

function flap(){
  if(state==='ready'){state='play';startScr.classList.add('hidden');}
  if(state!=='play')return;
  // consistent fixed jump: no screen-size randomness, slightly stronger than before
  const FLAP_V=-(Math.max(410,Math.min(470,H*0.58)));
  bird.v=FLAP_V;
  bird.targetRot=-0.28;
  bird.wing=1;sFlap();
  for(let i=0;i<5;i++)parts.push({x:bird.x-10,y:bird.y+8,vx:-120-Math.random()*80,vy:-40+Math.random()*120,life:.4,r:2+Math.random()*3});
}

function medalFor(s){return s>=40?'🏆':s>=30?'🥇':s>=20?'🥈':s>=10?'🥉':'🥚';}

function gameOver(){
  if(state!=='play')return;
  state='over';sHit();setTimeout(sDie,50);
  flash=1;shake=14;
  const isNew=score>best;
  if(isNew){best=score;localStorage.setItem('flappy_best_v2',best);}
  bestNum.textContent='BEST: '+best;
  fScore.textContent=score;fBest.textContent=best;fMedal.textContent=medalFor(score);
  newBest.classList.toggle('hidden',!isNew);
  setTimeout(()=>overScr.classList.remove('hidden'),600);
}
function restart(){overScr.classList.add('hidden');reset();state='play';}

function update(dt){
  frames++;
  const sp=(Math.min(320,W*0.75)+score*3.5); // px/sec
  // scenery always scrolls slowly on ready screen
  const scroll = state==='play'?sp:60;
  gX-=scroll*dt; if(gX<-28)gX+=28;
  clouds.forEach(c=>{c.x-=c.s*60*dt;if(c.x+c.w<0){c.x=W+20;c.y=20+Math.random()*H*0.4;}});
  hills.forEach(h=>{h.x-=scroll*0.4*dt;if(h.x+h.w<0)h.x=W+Math.random()*200;});
  parts=parts.filter(p=>(p.life-=dt)>0);
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;});
  if(shake>0)shake-=40*dt;
  if(flash>0)flash-=2.2*dt;

  if(state==='ready'){
    // stable state: bars scroll slowly, stay evenly spaced & aligned
    for(const p of pipes) p.x-=scroll*dt;
    pipes=pipes.filter(p=>p.x+pipeW()>-30);
    if(pipes.length===0 || pipes[pipes.length-1].x < W-pipeSpacing()) addPipe();
    bird.y=startY+Math.sin(frames*0.06)*10;bird.rot=Math.sin(frames*0.06)*0.08;bird.wing+=dt*8;return;
  }
  if(state!=='play')return;

  // physics (delta time) - consistent gravity + slightly stronger jump feel
  bird.v+=1650*dt; if(bird.v>640)bird.v=640;
  bird.y+=bird.v*dt;
  bird.wing=Math.max(0,bird.wing-dt*4);
  // fluid face tilt: tap = little up (-0.28), no tap = little down (max +0.5), never extreme
  const tRot = bird.v<0 ? -0.28 : Math.min(0.5,(bird.v/640)*0.5);
  bird.targetRot=tRot;
  const lerpK = bird.v<0 ? 12 : 7; // fast up, slow smooth down
  bird.rot += (bird.targetRot-bird.rot)*Math.min(1,dt*lerpK);

  // distance-based spawning = bars always evenly spaced
  if(pipes.length===0 || pipes[pipes.length-1].x < W-pipeSpacing()) addPipe();

  const pw=pipeW();
  for(const p of pipes){
    p.x-=sp*dt;
    if(!p.passed&&p.x+pw<bird.x-bird.r){p.passed=true;score++;scoreNum.textContent=score;scoreWrap.classList.remove('pop');void scoreWrap.offsetWidth;scoreWrap.classList.add('pop');sScore();}
    const inX=bird.x+bird.r-5>p.x&&bird.x-bird.r+5<p.x+pw;
    if(inX&&(bird.y-bird.r+4<p.top||bird.y+bird.r-4>p.bot)){gameOver();break;}
  }
  pipes=pipes.filter(p=>p.x+pw>-30);
  if(bird.y+bird.r>=H-GROUND){bird.y=H-GROUND-bird.r;gameOver();}
  if(bird.y<bird.r){bird.y=bird.r;bird.v=0;}
}

// --- draw ---
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawPipe(x,y,w,h,isTop){
  const g=ctx.createLinearGradient(x,0,x+w,0);
  g.addColorStop(0,'#166534');g.addColorStop(.18,'#4ade80');g.addColorStop(.5,'#bbf7d0');g.addColorStop(.8,'#22c55e');g.addColorStop(1,'#14532d');
  ctx.fillStyle=g;rr(x,y,w,h,5);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#14532d';ctx.stroke();
  const ch=26,cy=isTop?y+h-ch:y;
  ctx.fillStyle='#22c55e';rr(x-4,cy,w+8,ch,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(x+w*0.2,isTop?y+8:cy+4,w*0.16,h-20);
}
function drawBird(){
  const r=bird.r;
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);
  ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(3,r+6,r*0.8,r*0.25,0,0,7);ctx.fill();
  ctx.fillStyle='#f97316';ctx.beginPath();ctx.moveTo(-r*0.85,-2);ctx.lineTo(-r*1.55,-9);ctx.lineTo(-r*1.4,7);ctx.closePath();ctx.fill();
  const bg=ctx.createLinearGradient(0,-r,0,r);bg.addColorStop(0,'#fef08a');bg.addColorStop(.6,'#facc15');bg.addColorStop(1,'#f59e0b');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#92400e';ctx.stroke();
  ctx.fillStyle='#fefce8';ctx.beginPath();ctx.ellipse(-1,r*0.52,r*0.55,r*0.34,0,0,7);ctx.fill();
  const wv=Math.sin(bird.wing*20)*0.6+(bird.wing>0?-0.5:0.25);
  ctx.save();ctx.translate(-r*0.2,1);ctx.rotate(wv);
  ctx.fillStyle='#fb923c';ctx.strokeStyle='#9a3412';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(0,0,r*0.68,r*0.4,0,0,7);ctx.fill();ctx.stroke();ctx.restore();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(r*0.34,-r*0.32,r*0.44,0,7);ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#0f172a';ctx.stroke();
  ctx.fillStyle='#0f172a';ctx.beginPath();ctx.arc(r*0.5,-r*0.32,r*0.19,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(r*0.56,-r*0.38,r*0.06,0,7);ctx.fill();
  ctx.fillStyle='#ef4444';ctx.strokeStyle='#991b1b';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(r*0.68,-r*0.06);ctx.lineTo(r*1.28,r*0.12);ctx.lineTo(r*0.66,r*0.34);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#3aa0ef');sky.addColorStop(.55,'#8fd8ff');sky.addColorStop(.78,'#e8fbff');sky.addColorStop(1,'#fef9c3');
  ctx.fillStyle=sky;ctx.fillRect(-20,-20,W+40,H+40);
  // sun
  ctx.fillStyle='rgba(255,250,200,.95)';ctx.beginPath();ctx.arc(W*0.8,H*0.13,26,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,250,200,.3)';ctx.beginPath();ctx.arc(W*0.8,H*0.13,38,0,7);ctx.fill();
  // clouds
  ctx.fillStyle='rgba(255,255,255,.92)';
  clouds.forEach(c=>{ctx.beginPath();ctx.ellipse(c.x,c.y,c.w*.5,15,0,0,7);ctx.ellipse(c.x+20,c.y-10,c.w*.3,13,0,0,7);ctx.ellipse(c.x-22,c.y-5,c.w*.28,11,0,0,7);ctx.fill();});
  // hills
  ctx.fillStyle='#86c98f';
  hills.forEach(h=>{ctx.beginPath();ctx.ellipse(h.x+h.w/2,H-GROUND+8,h.w/2,h.h,0,Math.PI,0);ctx.fill();});
  // pipes
  const pw=pipeW();
  pipes.forEach(p=>{drawPipe(p.x,0,pw,p.top,true);drawPipe(p.x,p.bot,pw,H-GROUND-p.bot,false);});
  // ground
  const gy=H-GROUND;
  ctx.fillStyle='#e7c26a';ctx.fillRect(-20,gy,W+40,GROUND+20);
  ctx.fillStyle='#4ade80';ctx.fillRect(-20,gy,W+40,15);
  ctx.fillStyle='#16a34a';ctx.fillRect(-20,gy+15,W+40,5);
  ctx.fillStyle='rgba(120,70,0,.25)';
  for(let x=gX-20;x<W+20;x+=28)ctx.fillRect(x,gy+30,14,9);
  ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(-20,gy,W+40,3);
  // particles
  parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1;});
  drawBird();
  // ready text arrow
  if(state==='ready'){
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.font='800 15px system-ui';ctx.textAlign='center';
    ctx.fillText('PIPE KE BEECH SE NIKLO!',W/2,H*0.62);
  }
  ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${Math.max(0,flash)})`;ctx.fillRect(0,0,W,H);}
}

function loop(t){
  const dt=Math.min(0.033,(t-lastT)/1000||0.016);lastT=t;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// input
box.addEventListener('pointerdown',e=>{e.preventDefault();flap();},{passive:false});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap();}
  if(e.code==='Enter'&&state==='over')restart();
});
document.getElementById('startBtn').addEventListener('pointerdown',e=>{e.stopPropagation();});
document.getElementById('startBtn').addEventListener('click',e=>{e.stopPropagation();flap();});
document.getElementById('retryBtn').addEventListener('click',e=>{e.stopPropagation();restart();});
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
})();
</script>
</body>
</html>
